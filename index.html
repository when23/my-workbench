// ===== 成长管理（睡眠 / 饮食 / 出行运动）=====
const GROWTH_MODULES={sleep:{icon:'😴',title:'睡眠模块'},diet:{icon:'🍽️',title:'饮食模块'},out:{icon:'🏃',title:'出行运动模块'}};
function computeSleepDuration(sleepDate,sleepTime,wakeDate,wakeTime){
  if(!sleepTime||!wakeTime) return null;
  const s=new Date((sleepDate||fmtYMD(new Date()))+'T'+sleepTime);
  const w=new Date((wakeDate||fmtYMD(new Date()))+'T'+wakeTime);
  if(isNaN(s)||isNaN(w)) return null;
  let diff=(w-s)/3600000;
  if(diff<0) diff+=24; // 醒来时间早于入睡(如未填醒来日期)按跨天处理
  return Math.round(diff*10)/10;
}
function updateSleepPreview(p){
  const el=document.getElementById(p+'g-durPreview');if(!el)return;
  const sd=document.getElementById(p+'g-sleepDate').value,st=document.getElementById(p+'g-sleepTime').value,wd=document.getElementById(p+'g-wakeDate').value,wt=document.getElementById(p+'g-wakeTime').value;
  const d=computeSleepDuration(sd,st,wd,wt);
  if(d==null){el.textContent='⏱ 填写入睡和醒来时间后自动计算时长';el.className='growth-dur-preview';return}
  el.textContent='⏱ 本次睡眠时长：'+d+' 小时';el.className='growth-dur-preview active';
}
async function loadGrowth(){S.growthSleep=(await DB.get('growthSleep'))||[];S.growthDiet=(await DB.get('growthDiet'))||[];S.growthOut=(await DB.get('growthOut'))||[]}
function saveGrowthSleep(){return DB.set('growthSleep',S.growthSleep)}
function saveGrowthDiet(){return DB.set('growthDiet',S.growthDiet)}
function saveGrowthOut(){return DB.set('growthOut',S.growthOut)}
function growthSave(mod){return mod==='sleep'?saveGrowthSleep():mod==='diet'?saveGrowthDiet():saveGrowthOut()}
function growthRecordsOf(mod){return mod==='sleep'?S.growthSleep:mod==='diet'?S.growthDiet:S.growthOut}
function growthSort(arr){return [...arr].sort((a,b)=>{if((a.date||'')!==(b.date||''))return (b.date||'').localeCompare(a.date||'');return (b.timestamp||'').localeCompare(a.timestamp||'')})}
function growthStats(mod){
  if(mod==='sleep'){const arr=S.growthSleep;const count=arr.length;const total=arr.reduce((s,r)=>s+(Number(r.duration)||0),0);const avg=count?(total/count).toFixed(1):'0.0';const nightWake=arr.filter(r=>(r.abnormal||[]).includes('夜醒')).length;const nightmare=arr.filter(r=>(r.abnormal||[]).includes('做梦哭闹')).length;const sick=arr.filter(r=>(r.abnormal||[]).includes('生病')).length;return{count,avg,nightWake,nightmare,sick}}
  if(mod==='diet'){const arr=S.growthDiet;const mealDays=arr.filter(r=>(r.breakfast||r.lunch||r.dinner)).length;const normalSum=arr.reduce((s,r)=>s+(Number(r.bowelNormal)||0),0);const abArr=arr.filter(r=>r.bowelAbnormalType&&r.bowelAbnormalType!=='无'&&(Number(r.bowelAbnormalCount)||0)>0);const abnormalSum=abArr.reduce((s,r)=>s+(Number(r.bowelAbnormalCount)||0),0);const diarrhea=abArr.filter(r=>r.bowelAbnormalType==='腹泻').reduce((s,r)=>s+(Number(r.bowelAbnormalCount)||0),0);const constipation=abArr.filter(r=>r.bowelAbnormalType==='便秘').reduce((s,r)=>s+(Number(r.bowelAbnormalCount)||0),0);const picky=arr.filter(r=>(r.tags||[]).includes('挑食')).length;const vomit=arr.filter(r=>(r.tags||[]).includes('呕吐')).length;const allergy=arr.filter(r=>(r.tags||[]).includes('过敏')).length;return{mealDays,normalSum,abnormalSum,diarrhea,constipation,picky,vomit,allergy}}
  const arr=S.growthOut;const dates=new Set(arr.map(r=>r.date).filter(Boolean));const outDays=dates.size;const exHours=arr.reduce((s,r)=>s+(Number(r.exerciseHours)||0),0).toFixed(1);const locCount={};arr.forEach(r=>{if(r.location)locCount[r.location]=(locCount[r.location]||0)+1});const topLocations=Object.entries(locCount).map(([loc,count])=>({loc,count})).sort((a,b)=>b.count-a.count).slice(0,3);return{outDays,exHours,topLocations}
}
function growthModuleStatsHTML(mod,st){
  if(mod==='sleep'){return `<div class="gm-stat"><span class="gm-stat-num">${st.count}</span><span class="gm-stat-label">总睡眠记录(条)</span></div><div class="gm-stat"><span class="gm-stat-num">${st.avg}h</span><span class="gm-stat-label">日均睡眠</span></div><div class="growth-chips">${(st.nightWake||st.nightmare||st.sick)?`${st.nightWake?`<span class="growth-chip ab">夜醒 ${st.nightWake}</span>`:''}${st.nightmare?`<span class="growth-chip ab">做梦哭闹 ${st.nightmare}</span>`:''}${st.sick?`<span class="growth-chip ab">生病 ${st.sick}</span>`:''}`:'<span class="growth-chip">暂无异常</span>'}</div>`}
  if(mod==='diet'){return `<div class="gm-stat"><span class="gm-stat-num">${st.mealDays}</span><span class="gm-stat-label">正餐记录(天)</span></div><div class="gm-stat"><span class="gm-stat-num">${st.normalSum}</span><span class="gm-stat-label">正常排便(次)</span></div><div class="gm-stat"><span class="gm-stat-num">${st.abnormalSum}</span><span class="gm-stat-label">异常排便(次)</span></div><div class="growth-chips">${st.picky?`<span class="growth-chip">挑食 ${st.picky}</span>`:''}${st.vomit?`<span class="growth-chip">呕吐 ${st.vomit}</span>`:''}${st.allergy?`<span class="growth-chip ab">过敏 ${st.allergy}</span>`:''}${st.mealDays===0&&st.normalSum===0&&st.abnormalSum===0&&!st.picky&&!st.vomit&&!st.allergy?'<span class="growth-chip">暂无记录</span>':''}</div>`}
  const top=st.topLocations.map((l,i)=>`${i+1}.${escapeHtml(l.loc)}(${l.count})`).join(' · ');
  return `<div class="gm-stat"><span class="gm-stat-num">${st.outDays}</span><span class="gm-stat-label">户外天数</span></div><div class="gm-stat"><span class="gm-stat-num">${st.exHours}h</span><span class="gm-stat-label">运动时长合计</span></div>${st.outDays?`<div class="growth-row">📍 Top3：${top}</div>`:''}`
}
function renderGrowthOverview(){
  const m=document.getElementById('growthModules');if(!m)return;
  m.innerHTML=Object.keys(GROWTH_MODULES).map(mod=>`<div class="growth-module-card" onclick="openGrowthModule('${mod}')"><div class="gm-head"><span class="gm-icon">${GROWTH_MODULES[mod].icon}</span><span class="gm-title">${GROWTH_MODULES[mod].title}</span><span class="gm-arrow">›</span></div><div class="gm-stats">${growthModuleStatsHTML(mod,growthStats(mod))}</div></div>`).join('');
}
function openGrowthModule(mod){
  S.growthModule=mod;
  document.getElementById('growthOverview').style.display='none';
  document.getElementById('growthDetailView').style.display='block';
  document.getElementById('growthDetailTitle').textContent=GROWTH_MODULES[mod].icon+' '+GROWTH_MODULES[mod].title;
  document.getElementById('growthFormCard').innerHTML=growthFormHTML(mod,null,'')+'<button class="btn btn-primary" style="width:100%;margin-top:12px" onclick="submitGrowthAdd()">+ 添加记录</button>';
  renderGrowthDetail();
}
function growthBackToList(){S.growthModule=null;document.getElementById('growthDetailView').style.display='none';document.getElementById('growthOverview').style.display='block';renderGrowthOverview()}
document.getElementById('growthBackList').addEventListener('click',growthBackToList);
function growthFormHTML(mod,rec,p){
  const today=fmtYMD(new Date());
  const dateVal=rec?rec.date:today;
  if(mod==='sleep'){
    const ab=rec?rec.abnormal||[]:[];
    const sd=rec?rec.sleepDate||rec.date||'':'';
    const st=rec?rec.sleepTime||'':'';
    const wd=rec?rec.wakeDate||rec.date||'':'';
    const wt=rec?rec.wakeTime||'':'';
    return `<label>入睡日期</label><input type="date" id="${p}g-sleepDate" value="${sd}" onchange="updateSleepPreview('${p}')"><label>入睡时间</label><input type="time" id="${p}g-sleepTime" value="${st}" onchange="updateSleepPreview('${p}')"><label>醒来日期</label><input type="date" id="${p}g-wakeDate" value="${wd}" onchange="updateSleepPreview('${p}')"><label>醒来时间</label><input type="time" id="${p}g-wakeTime" value="${wt}" onchange="updateSleepPreview('${p}')"><div class="growth-dur-preview" id="${p}g-durPreview">⏱ 填写入睡和醒来时间后自动计算时长</div><label>异常情况(可多选)</label><div class="growth-chips"><label class="growth-chk"><input type="checkbox" name="${p}g-ab" value="夜醒" ${ab.includes('夜醒')?'checked':''}>夜醒</label><label class="growth-chk"><input type="checkbox" name="${p}g-ab" value="做梦哭闹" ${ab.includes('做梦哭闹')?'checked':''}>做梦哭闹</label><label class="growth-chk"><input type="checkbox" name="${p}g-ab" value="生病" ${ab.includes('生病')?'checked':''}>生病</label></div><label>备注(可选)</label><textarea id="${p}g-note" rows="2" placeholder="如：入睡较晚">${rec?escapeHtml(rec.note||''):''}</textarea>`;
  }
  if(mod==='diet'){
    const tags=rec?rec.tags||[]:[];
    return `<label>日期</label><input type="date" id="${p}g-date" value="${dateVal}"><label>早餐(吃了什么)</label><textarea id="${p}g-break" rows="2" placeholder="如：米粉+蛋黄">${rec?escapeHtml(rec.breakfast||''):''}</textarea><label>中餐(吃了什么)</label><textarea id="${p}g-lunch" rows="2" placeholder="如：米饭+青菜+肉">${rec?escapeHtml(rec.lunch||''):''}</textarea><label>晚餐(吃了什么)</label><textarea id="${p}g-dinner" rows="2" placeholder="如：面条">${rec?escapeHtml(rec.dinner||''):''}</textarea><div style="display:flex;gap:10px;flex-wrap:wrap"><div style="flex:1;min-width:88px"><label>正常排便(次)</label><input type="number" id="${p}g-bn" min="0" step="1" value="${rec&&rec.bowelNormal!=null?rec.bowelNormal:''}"></div><div style="flex:1;min-width:96px"><label>异常类型</label><select id="${p}g-bt"><option value="无" ${(!rec||rec.bowelAbnormalType==='无'||!rec.bowelAbnormalType)?'selected':''}>无</option><option value="腹泻" ${rec&&rec.bowelAbnormalType==='腹泻'?'selected':''}>腹泻</option><option value="便秘" ${rec&&rec.bowelAbnormalType==='便秘'?'selected':''}>便秘</option></select></div><div style="flex:1;min-width:88px"><label>异常次数</label><input type="number" id="${p}g-bc" min="0" step="1" value="${rec&&rec.bowelAbnormalCount!=null?rec.bowelAbnormalCount:''}"></div></div><label>饮食备注标签(可多选)</label><div class="growth-chips"><label class="growth-chk"><input type="checkbox" name="${p}g-tags" value="挑食" ${tags.includes('挑食')?'checked':''}>挑食</label><label class="growth-chk"><input type="checkbox" name="${p}g-tags" value="呕吐" ${tags.includes('呕吐')?'checked':''}>呕吐</label><label class="growth-chk"><input type="checkbox" name="${p}g-tags" value="过敏" ${tags.includes('过敏')?'checked':''}>过敏</label></div><label>备注(可选)</label><textarea id="${p}g-note" rows="2" placeholder="其他备注">${rec?escapeHtml(rec.note||''):''}</textarea>`;
  }
  return `<label>日期</label><input type="date" id="${p}g-date" value="${dateVal}"><label>外出地点</label><input type="text" id="${p}g-loc" placeholder="如：公园 / 小区 / 商场" value="${rec?escapeHtml(rec.location||''):''}"><label>运动时长(小时)</label><input type="number" id="${p}g-ex" step="0.5" min="0" placeholder="如 1.5" value="${rec&&rec.exerciseHours!=null?rec.exerciseHours:''}"><label>备注(可选)</label><textarea id="${p}g-note" rows="2" placeholder="如：骑平衡车">${rec?escapeHtml(rec.note||''):''}</textarea>`;
}
async function submitGrowthAdd(){
  const mod=S.growthModule;if(!mod)return;
  const date=document.getElementById('g-date').value;
  if(!date){showToast('请选择日期','error');return}
  const rec={id:genId(),date,timestamp:nowISO()};
  if(mod==='sleep'){const sleepDate=document.getElementById('g-sleepDate').value;const sleepTime=document.getElementById('g-sleepTime').value;const wakeDate=document.getElementById('g-wakeDate').value;const wakeTime=document.getElementById('g-wakeTime').value;if(!sleepDate){showToast('请选择入睡日期','error');return}if(!sleepTime||!wakeTime){showToast('请填写入睡和醒来时间','error');return}const duration=computeSleepDuration(sleepDate,sleepTime,wakeDate,wakeTime)||0;rec.date=sleepDate;rec.sleepDate=sleepDate;rec.sleepTime=sleepTime;rec.wakeDate=wakeDate;rec.wakeTime=wakeTime;rec.duration=duration;rec.abnormal=Array.from(document.querySelectorAll('[name="g-ab"]')).filter(c=>c.checked).map(c=>c.value);rec.note=document.getElementById('g-note').value.trim()}
  else if(mod==='diet'){rec.breakfast=document.getElementById('g-break').value.trim();rec.lunch=document.getElementById('g-lunch').value.trim();rec.dinner=document.getElementById('g-dinner').value.trim();rec.bowelNormal=Number(document.getElementById('g-bn').value)||0;rec.bowelAbnormalType=document.getElementById('g-bt').value;rec.bowelAbnormalCount=Number(document.getElementById('g-bc').value)||0;rec.tags=Array.from(document.querySelectorAll('[name="g-tags"]')).filter(c=>c.checked).map(c=>c.value);rec.note=document.getElementById('g-note').value.trim();if(!rec.breakfast&&!rec.lunch&&!rec.dinner&&!rec.bowelNormal&&!rec.bowelAbnormalCount&&rec.tags.length===0){showToast('请至少填写一项内容','error');return}}
  else{rec.location=document.getElementById('g-loc').value.trim();const ex=document.getElementById('g-ex').value;rec.exerciseHours=ex===''?0:Number(ex);rec.note=document.getElementById('g-note').value.trim();if(!rec.location&&!rec.exerciseHours){showToast('请填写外出地点或运动时长','error');return}}
  if(mod==='sleep')S.growthSleep.unshift(rec);else if(mod==='diet')S.growthDiet.unshift(rec);else S.growthOut.unshift(rec);
  await growthSave(mod);
  document.getElementById('growthFormCard').innerHTML=growthFormHTML(mod,null,'')+'<button class="btn btn-primary" style="width:100%;margin-top:12px" onclick="submitGrowthAdd()">+ 添加记录</button>';
  renderGrowthDetail();showToast('记录成功','success');
}
function renderGrowthDetail(){
  const mod=S.growthModule;if(!mod)return;
  const arr=growthSort(growthRecordsOf(mod));
  const list=document.getElementById('growthList');
  if(arr.length===0){list.innerHTML='<div class="empty"><div class="empty-icon">'+GROWTH_MODULES[mod].icon+'</div><p>还没有记录<br>在上方添加第一条吧</p></div>';return}
  list.innerHTML=arr.map(r=>{
    let body='';
    if(mod==='sleep'){const ab=(r.abnormal||[]).map(t=>`<span class="growth-chip ab">${t}</span>`).join('')||'<span class="growth-chip">无异常</span>';const timeInfo=(r.sleepTime||r.wakeTime)?`🌙 ${r.sleepTime||'?'} 睡 → ☀️ ${r.wakeTime||'?'} 醒`:'';body=`<div class="record-text">😴 睡眠 ${r.duration!=null?r.duration:0} 小时</div>${timeInfo?`<div class="growth-row">${timeInfo}</div>`:''}<div class="growth-chips">${ab}</div>${r.note?`<div class="record-text" style="margin-top:4px">📝 ${escapeHtml(r.note)}</div>`:''}`}
    else if(mod==='diet'){const meals=[];if(r.breakfast)meals.push('🌅 早餐：'+escapeHtml(r.breakfast));if(r.lunch)meals.push('☀️ 中餐：'+escapeHtml(r.lunch));if(r.dinner)meals.push('🌙 晚餐：'+escapeHtml(r.dinner));const bowel=`<div class="growth-row">💩 正常 ${r.bowelNormal||0} 次${r.bowelAbnormalType&&r.bowelAbnormalType!=='无'&&r.bowelAbnormalCount?` · 异常(${escapeHtml(r.bowelAbnormalType)}) ${r.bowelAbnormalCount} 次`:''}</div>`;const tags=(r.tags||[]).map(t=>`<span class="growth-chip ${t==='过敏'?'ab':''}">${t}</span>`).join('');body=(meals.length?meals.map(m=>`<div class="record-text">${m}</div>`).join(''):'<div class="record-text" style="color:var(--text-3)">当天未记录正餐</div>')+bowel+(tags?`<div class="growth-chips" style="margin-top:6px">${tags}</div>`:'')+(r.note?`<div class="record-text" style="margin-top:4px">📝 ${escapeHtml(r.note)}</div>`:'')}
    else{body=`<div class="record-text">📍 ${r.location?escapeHtml(r.location):'未填地点'} · 🏃 运动 ${r.exerciseHours!=null?r.exerciseHours:0} 小时</div>${r.note?`<div class="record-text" style="margin-top:4px">📝 ${escapeHtml(r.note)}</div>`:''}`}
    return `<div class="record-card"><div class="record-meta"><span class="growth-record-date">${r.date||''}</span><span class="record-time">${fmtDate(r.timestamp)}</span></div>${body}<div class="record-actions"><button class="btn btn-ghost btn-sm" onclick="editGrowthRecord('${mod}','${r.id}')">编辑</button><button class="btn btn-danger btn-sm" onclick="delGrowthRecord('${mod}','${r.id}')">删除</button></div></div>`;
  }).join('');
}
async function delGrowthRecord(mod,id){if(!confirm('确定删除这条记录吗？'))return;const arr=growthRecordsOf(mod);const idx=arr.findIndex(r=>r.id===id);if(idx<0)return;arr.splice(idx,1);if(mod==='sleep')S.growthSleep=arr;else if(mod==='diet')S.growthDiet=arr;else S.growthOut=arr;await growthSave(mod);renderGrowthDetail();showToast('已删除','success')}
function editGrowthRecord(mod,id){const arr=growthRecordsOf(mod);const rec=arr.find(r=>r.id===id);if(!rec)return;openEditModal('编辑记录',growthFormHTML(mod,rec,'edit-'));document.getElementById('saveEdit').onclick=async()=>{if(mod==='sleep'){const sleepDate=document.getElementById('edit-g-sleepDate').value;const sleepTime=document.getElementById('edit-g-sleepTime').value;const wakeDate=document.getElementById('edit-g-wakeDate').value;const wakeTime=document.getElementById('edit-g-wakeTime').value;if(!sleepDate){showToast('请选择入睡日期','error');return}const duration=computeSleepDuration(sleepDate,sleepTime,wakeDate,wakeTime);rec.date=sleepDate;rec.sleepDate=sleepDate;rec.sleepTime=sleepTime;rec.wakeDate=wakeDate;rec.wakeTime=wakeTime;rec.duration=duration==null?(rec.duration!=null?rec.duration:0):duration;rec.abnormal=Array.from(document.querySelectorAll('[name="edit-g-ab"]')).filter(c=>c.checked).map(c=>c.value);rec.note=document.getElementById('edit-g-note').value.trim()}else if(mod==='diet'){const date=document.getElementById('edit-g-date').value;if(!date){showToast('请选择日期','error');return}rec.date=date;rec.breakfast=document.getElementById('edit-g-break').value.trim();rec.lunch=document.getElementById('edit-g-lunch').value.trim();rec.dinner=document.getElementById('edit-g-dinner').value.trim();rec.bowelNormal=Number(document.getElementById('edit-g-bn').value)||0;rec.bowelAbnormalType=document.getElementById('edit-g-bt').value;rec.bowelAbnormalCount=Number(document.getElementById('edit-g-bc').value)||0;rec.tags=Array.from(document.querySelectorAll('[name="edit-g-tags"]')).filter(c=>c.checked).map(c=>c.value);rec.note=document.getElementById('edit-g-note').value.trim()}else{const date=document.getElementById('edit-g-date').value;if(!date){showToast('请选择日期','error');return}rec.date=date;rec.location=document.getElementById('edit-g-loc').value.trim();const ex=document.getElementById('edit-g-ex').value;rec.exerciseHours=ex===''?0:Number(ex);rec.note=document.getElementById('edit-g-note').value.trim()}await growthSave(mod);closeEditModal();renderGrowthDetail();showToast('已更新','success')}}

init();
