<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="记录工作台">
<meta name="theme-color" content="#6366f1">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>个人日常记录工作台</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#f7f8fa;--surface:#fff;--primary:#6366f1;--primary-hover:#4f46e5;--primary-light:#eef2ff;--text:#1f2937;--text-2:#6b7280;--text-3:#9ca3af;--border:#e5e7eb;--border-l:#f3f4f6;--success:#10b981;--danger:#ef4444;--danger-bg:#fef2f2;--shadow-sm:0 1px 2px rgba(0,0,0,.05);--shadow:0 1px 3px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.04);--shadow-lg:0 10px 15px -3px rgba(0,0,0,.1),0 4px 6px -4px rgba(0,0,0,.05);--r:12px;--r-s:8px;--r-xs:6px}
html{font-size:15px;-webkit-text-size-adjust:100%}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased;min-height:100vh;min-height:100dvh}
@media (max-width:768px){input,textarea,select{font-size:16px}}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea,select{font-family:inherit;font-size:inherit;color:inherit}
textarea{resize:vertical}
img{max-width:100%;display:block}
#app{max-width:920px;margin:0 auto;padding:16px 16px 60px}
@media(max-width:640px){#app{padding:10px 10px 50px;max-width:100%}}
.header{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:20px}
.header h1{font-size:20px;font-weight:700;display:flex;align-items:center;gap:8px}
.header-logo{width:32px;height:32px;background:var(--primary);border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:18px}
.header-actions{display:flex;gap:8px}
@media(max-width:480px){.header h1{font-size:16px}.header-logo{width:28px;height:28px;font-size:15px;border-radius:6px}.btn{padding:6px 10px;font-size:12px}}
.btn{padding:8px 14px;border-radius:var(--r-s);font-size:13px;font-weight:500;transition:all .15s;display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.btn-ghost{color:var(--text-2);background:var(--surface);border:1px solid var(--border)}
.btn-ghost:hover{background:var(--border-l);color:var(--text)}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-hover)}
.btn-danger{background:var(--danger-bg);color:var(--danger)}
.btn-danger:hover{background:var(--danger);color:#fff}
.btn-sm{padding:5px 10px;font-size:12px}
.layout{display:flex;gap:12px;align-items:flex-start}
.sidebar{flex-shrink:0;display:flex;flex-direction:column;gap:6px;background:var(--surface);border-radius:var(--r);padding:8px;box-shadow:var(--shadow-sm);position:sticky;top:12px;z-index:10}
.main-content{flex:1;min-width:0}
.tabs{display:flex;flex-direction:column;gap:4px}
.tab{display:flex;flex-direction:column;align-items:center;gap:4px;padding:14px 10px;border-radius:var(--r-s);font-size:12px;font-weight:500;color:var(--text-2);transition:all .2s;text-align:center;width:100%;line-height:1.3}
.tab-icon{font-size:22px}
.tab.active{background:var(--primary);color:#fff;box-shadow:var(--shadow)}
.tab:not(.active):hover{background:var(--border-l);color:var(--text)}
@media(min-width:769px){.sidebar{width:80px}}
@media(max-width:768px){.sidebar{width:56px;padding:6px}.tab{padding:10px 4px;font-size:10px}.tab-icon{font-size:18px}}
@media(max-width:400px){.sidebar{width:48px}.tab{padding:8px 2px;font-size:9px}.tab-icon{font-size:16px}}
.tab-content{display:none;animation:fadeIn .2s ease}
.tab-content.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.date-nav{display:flex;align-items:center;gap:8px;margin-bottom:20px;background:var(--surface);padding:10px 14px;border-radius:var(--r);box-shadow:var(--shadow-sm)}
.date-nav button{width:36px;height:36px;border-radius:var(--r-s);background:var(--border-l);color:var(--text);font-size:18px;font-weight:600;display:flex;align-items:center;justify-content:center;transition:all .15s;flex-shrink:0}
.date-nav button:hover{background:var(--primary-light);color:var(--primary)}
.date-nav input[type=date]{flex:1;border:1px solid var(--border);border-radius:var(--r-s);padding:8px 12px;font-size:14px;background:var(--surface);min-width:0}
.date-nav input[type=date]:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-light)}
.date-nav .today-btn{width:auto;padding:0 14px;font-size:13px;font-weight:500}
.boards-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:768px){.boards-grid{grid-template-columns:1fr}}
.board-card{background:var(--surface);border-radius:var(--r);padding:16px;box-shadow:var(--shadow-sm);transition:box-shadow .2s}
.board-card:hover{box-shadow:var(--shadow)}
.board-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:8px}
.board-name{flex:1;font-size:15px;font-weight:600;color:var(--text);background:transparent;border:1px solid transparent;border-radius:var(--r-xs);padding:4px 8px;min-width:0}
.board-name:hover{border-color:var(--border)}
.board-name:focus{outline:none;border-color:var(--primary);background:var(--primary-light)}
.task-list{display:flex;flex-direction:column;gap:4px}
.task-item{display:flex;align-items:center;gap:8px;padding:8px 8px;border-radius:var(--r-xs);transition:background .15s}
.task-item:hover{background:var(--border-l)}
.task-item.done .task-text{text-decoration:line-through;color:var(--text-3)}
.task-checkbox{width:20px;height:20px;border:2px solid var(--border);border-radius:5px;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .15s;cursor:pointer}
.task-checkbox.checked{background:var(--success);border-color:var(--success);color:#fff}
.task-checkbox.checked::after{content:'';width:6px;height:10px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.task-text{flex:1;font-size:14px;word-break:break-word;cursor:pointer}
.task-delete{opacity:0;width:24px;height:24px;border-radius:var(--r-xs);color:var(--text-3);font-size:16px;display:flex;align-items:center;justify-content:center;transition:all .15s;flex-shrink:0}
.task-item:hover .task-delete{opacity:1}
.task-delete:hover{background:var(--danger-bg);color:var(--danger)}
.task-carry{font-size:12px;opacity:.5;margin-right:2px;cursor:help}
.add-task{display:flex;gap:6px;margin-top:6px}
.add-task input{flex:1;border:1px solid var(--border);border-radius:var(--r-xs);padding:7px 10px;font-size:13px;background:var(--bg);min-width:0}
.add-task input:focus{outline:none;border-color:var(--primary);background:var(--surface)}
.add-task button{width:32px;height:32px;border-radius:var(--r-xs);background:var(--primary);color:#fff;font-size:16px;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:background .15s}
.add-task button:hover{background:var(--primary-hover)}
.input-card{background:var(--surface);border-radius:var(--r);padding:16px;box-shadow:var(--shadow-sm);margin-bottom:20px}
.input-card textarea{width:100%;border:1px solid var(--border);border-radius:var(--r-s);padding:10px 12px;font-size:16px;min-height:80px;background:var(--bg);transition:border-color .15s}
.input-card textarea:focus{outline:none;border-color:var(--primary);background:var(--surface)}
.input-row{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.input-row select,.input-row input{border:1px solid var(--border);border-radius:var(--r-s);padding:8px 12px;font-size:14px;background:var(--bg);flex:1;min-width:120px}
.input-row select:focus,.input-row input:focus{outline:none;border-color:var(--primary);background:var(--surface)}
.image-preview{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.image-preview-item{position:relative;width:72px;height:72px;border-radius:var(--r-xs);overflow:hidden;border:1px solid var(--border)}
.image-preview-item img{width:100%;height:100%;object-fit:cover}
.image-preview-item .remove-img{position:absolute;top:2px;right:2px;width:18px;height:18px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;font-size:12px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.upload-btn{display:inline-flex;align-items:center;gap:5px;padding:7px 12px;border:1px dashed var(--border);border-radius:var(--r-s);font-size:13px;color:var(--text-2);cursor:pointer;transition:all .15s;background:var(--bg)}
.upload-btn:hover{border-color:var(--primary);color:var(--primary);background:var(--primary-light)}
.upload-btn input{display:none}
.input-actions{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:8px}
.filter-bar{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:16px;-webkit-overflow-scrolling:touch}
.filter-bar::-webkit-scrollbar{height:0}
.filter-btn{padding:5px 12px;border-radius:20px;font-size:13px;color:var(--text-2);background:var(--surface);border:1px solid var(--border);white-space:nowrap;transition:all .15s}
.filter-btn.active{background:var(--primary);color:#fff;border-color:var(--primary)}
/* ===== Org 3-Layer ===== */
.org-stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
@media(max-width:640px){.org-stats-grid{grid-template-columns:repeat(2,1fr)}}
.org-stat-card{background:var(--surface);border-radius:var(--r);padding:16px 12px;box-shadow:var(--shadow-sm);text-align:center}
.org-stat-num{font-size:28px;font-weight:700;color:var(--primary)}
.org-stat-label{font-size:12px;color:var(--text-2);margin-top:4px}
.org-list-section{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow-sm);overflow:hidden}
.org-list-header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--border-l)}
.org-list-header h3{font-size:16px;font-weight:600}
.org-cat-list{display:flex;flex-direction:column}
.org-cat-item{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--border-l);cursor:pointer;transition:background .15s;position:relative}
.org-cat-item:last-child{border-bottom:none}
.org-cat-item:hover{background:var(--border-l)}
.org-cat-item .cat-icon{font-size:24px}
.org-cat-item .cat-name{flex:1;font-size:14px;font-weight:500}
.org-cat-item .cat-count{font-size:13px;color:var(--text-3)}
.org-cat-item .cat-arrow{font-size:18px;color:var(--text-3)}
.org-cat-item .cat-del{width:22px;height:22px;border-radius:50%;background:var(--danger-bg);color:var(--danger);font-size:13px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
@media (hover:hover) and (pointer:fine){.org-cat-item .cat-del{display:none}.org-cat-item:hover .cat-del{display:flex}}
.org-cat-item .cat-handle{width:16px;flex-shrink:0;color:var(--text-3);font-size:15px;line-height:1;display:flex;align-items:center;justify-content:center;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
.org-cat-item .cat-handle:active{color:var(--primary)}
.org-cat-item.dragging{opacity:.35;background:var(--primary-light)}
.org-cat-item.drop-before{box-shadow:inset 0 3px 0 0 var(--primary)}
.org-cat-item.drop-after{box-shadow:inset 0 -3px 0 0 var(--primary)}
.org-location-group{background:var(--surface);border-radius:var(--r);padding:14px 16px;box-shadow:var(--shadow-sm);margin-bottom:10px;cursor:pointer;transition:all .15s;display:flex;align-items:center;gap:12px}
.org-location-group:hover{box-shadow:var(--shadow)}
.org-location-group .loc-icon{font-size:20px}
.org-location-group .loc-name{flex:1;font-size:15px;font-weight:500}
.org-location-group .loc-count{font-size:13px;color:var(--text-3)}
.org-location-group .loc-arrow{font-size:18px;color:var(--text-3)}
.record-status{display:inline-flex;align-items:center;gap:3px;padding:2px 8px;border-radius:12px;font-size:11px;font-weight:600;cursor:pointer;transition:all .15s}
.record-status.none{background:#f3f4f6;color:#6b7280}
.record-status.pending{background:#fef3c7;color:#92400e}
.record-status.done{background:#d1fae5;color:#065f46}
.org-stat-card.clickable{cursor:pointer;transition:all .15s}
.org-stat-card.clickable:hover{background:var(--primary-light);border-color:var(--primary)}
.btn.pinned-on{background:var(--primary-light);color:var(--primary);border-color:var(--primary)}
.org-detail-header{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.org-detail-header .back-btn{width:36px;height:36px;border-radius:var(--r-s);background:var(--surface);box-shadow:var(--shadow-sm);font-size:18px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.org-detail-header h2{font-size:16px;font-weight:600;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.emoji-picker{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;margin-top:4px}
.emoji-item{width:100%;aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:22px;border-radius:var(--r-xs);cursor:pointer;transition:all .15s;border:2px solid transparent}
.emoji-item:hover{background:var(--border-l)}
.emoji-item.selected{border-color:var(--primary);background:var(--primary-light)}
.record-list{display:flex;flex-direction:column;gap:12px}
.record-card{background:var(--surface);border-radius:var(--r);padding:14px 16px;box-shadow:var(--shadow-sm);transition:box-shadow .2s}
.record-card:hover{box-shadow:var(--shadow)}
.record-meta{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.record-tag{padding:2px 8px;border-radius:12px;font-size:11px;font-weight:600}
.record-tag.衣物{background:#dbeafe;color:#1e40af}
.record-tag.化妆用品{background:#fce7f3;color:#9d174d}
.record-tag.厨房用品{background:#d1fae5;color:#065f46}
.record-tag.书籍{background:#fef3c7;color:#92400e}
.record-tag.数码产品{background:#e0e7ff;color:#3730a3}
.record-tag.其他{background:#f3f4f6;color:#374151}
.record-time{font-size:12px;color:var(--text-3)}
.record-title{font-size:15px;font-weight:600;margin-bottom:4px}
.record-text{font-size:14px;color:var(--text-2);white-space:pre-wrap;word-break:break-word}
.record-location{font-size:12px;color:var(--primary);margin-top:6px;display:flex;align-items:center;gap:4px}
.record-images{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.record-images img{width:80px;height:80px;object-fit:cover;border-radius:var(--r-xs);cursor:pointer;transition:transform .15s;border:1px solid var(--border-l)}
.record-images img:hover{transform:scale(1.05)}
.record-actions{display:flex;gap:6px;margin-top:10px;padding-top:10px;border-top:1px solid var(--border-l)}
.empty{text-align:center;padding:40px 20px;color:var(--text-3)}
.empty-icon{font-size:36px;margin-bottom:8px;opacity:.5}
.empty p{font-size:14px}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:center;justify-content:center;z-index:1000;padding:20px;animation:fadeIn .15s}
.modal-overlay.show{display:flex}
.modal{background:var(--surface);border-radius:var(--r);width:100%;max-width:540px;max-height:90vh;max-height:90dvh;overflow-y:auto;box-shadow:var(--shadow-lg)}
.modal-header{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--border-l);position:sticky;top:0;background:var(--surface);z-index:1}
.modal-header h3{font-size:16px;font-weight:600}
.modal-close{width:32px;height:32px;border-radius:var(--r-xs);font-size:20px;color:var(--text-3);display:flex;align-items:center;justify-content:center;transition:all .15s}
.modal-close:hover{background:var(--border-l);color:var(--text)}
.modal-body{padding:16px 20px}
.modal-body textarea,.modal-body input,.modal-body select{width:100%;border:1px solid var(--border);border-radius:var(--r-s);padding:10px 12px;font-size:16px;background:var(--bg);margin-bottom:10px}
.modal-body textarea:focus,.modal-body input:focus,.modal-body select:focus{outline:none;border-color:var(--primary);background:var(--surface)}
.modal-body textarea{min-height:100px}
.modal-body label{display:block;font-size:13px;color:var(--text-2);margin-bottom:4px;margin-top:10px}
.modal-body label:first-child{margin-top:0}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;padding:16px 20px;border-top:1px solid var(--border-l);position:sticky;bottom:0;background:var(--surface)}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(100px);background:#1f2937;color:#fff;padding:10px 20px;border-radius:var(--r-s);font-size:14px;box-shadow:var(--shadow-lg);z-index:2000;transition:transform .25s ease;pointer-events:none}
.toast.show{transform:translateX(-50%) translateY(0)}
.toast.success{background:var(--success)}
.toast.error{background:var(--danger)}
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.9);display:none;align-items:center;justify-content:center;z-index:3000;padding:20px;cursor:zoom-out}
.lightbox.show{display:flex}
.lightbox img{max-width:95%;max-height:95%;border-radius:8px}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--text-3)}
.task-item{animation:slideIn .2s ease}
@keyframes slideIn{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:none}}
.install-banner{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:12px 20px;box-shadow:var(--shadow-lg);z-index:1500;display:none;align-items:center;gap:12px;max-width:90vw}
.install-banner.show{display:flex}
.install-banner span{font-size:13px;color:var(--text-2)}
/* 更新提示 / 备份引导 横幅（顶部，固定在 install 横幅之上） */
.update-banner,.backup-banner{position:fixed;top:0;left:0;right:0;z-index:1600;background:var(--primary);color:#fff;padding:11px 14px;display:none;align-items:center;gap:10px;font-size:13px;box-shadow:var(--shadow-lg)}
.update-banner.show,.backup-banner.show{display:flex}
.update-banner span,.backup-banner span{flex:1;line-height:1.4}
.update-banner .btn,.backup-banner .btn{background:rgba(255,255,255,.22);color:#fff;border:1px solid rgba(255,255,255,.4);white-space:nowrap}
.update-banner .btn:hover,.backup-banner .btn:hover{background:rgba(255,255,255,.34)}
/* ===== Outfit (日常穿搭) ===== */
.outfit-entry{display:flex;align-items:center;gap:12px;padding:14px 16px;background:linear-gradient(135deg,#fff7ed,#fef3c7);border:1px dashed #f59e0b;border-radius:var(--r);margin-bottom:12px;cursor:pointer;transition:all .15s}
.outfit-entry:hover{box-shadow:var(--shadow)}
.outfit-entry .cat-icon{font-size:24px}
.outfit-entry .cat-name{flex:1;font-size:14px;font-weight:600;color:#92400e}
.outfit-entry .cat-arrow{font-size:18px;color:#92400e}
.outfit-sel{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--surface);border-radius:var(--r-s);box-shadow:var(--shadow-sm);margin-bottom:10px;cursor:pointer;transition:all .15s;border:2px solid transparent}
.outfit-sel:hover{box-shadow:var(--shadow)}
.outfit-sel.selected{border-color:var(--primary);background:var(--primary-light)}
.outfit-sel .sel-check{width:22px;height:22px;border:2px solid var(--border);border-radius:6px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:14px;color:#fff;transition:all .15s;flex-shrink:0}
.outfit-sel.selected .sel-check{background:var(--primary);border-color:var(--primary)}
.outfit-sel .sel-thumb{width:48px;height:48px;border-radius:var(--r-xs);object-fit:cover;flex-shrink:0;background:var(--border-l)}
.outfit-sel .sel-info{flex:1;min-width:0}
.outfit-sel .sel-title{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.outfit-sel .sel-sub{font-size:12px;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.outfit-cart{position:sticky;bottom:0;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;background:var(--surface);border-top:1px solid var(--border);box-shadow:0 -4px 12px rgba(0,0,0,.06);margin:12px -16px -16px;padding-left:16px;padding-right:16px}
.outfit-cart-count{font-size:13px;font-weight:600;color:var(--primary)}
.outfit-group{margin-bottom:18px}
.outfit-group-title{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700;color:var(--text);margin-bottom:10px;padding-bottom:6px;border-bottom:2px solid var(--border-l)}
.outfit-group-title.loc-toggle{cursor:pointer;transition:background .15s;border-radius:var(--r-xs)}
.outfit-group-title.loc-toggle:hover{background:var(--border-l)}
.outfit-group-title .loc-sel{color:var(--primary);font-weight:600;font-size:12px}
.outfit-card{background:var(--surface);border-radius:var(--r);padding:14px 16px;box-shadow:var(--shadow-sm);margin-bottom:10px;transition:box-shadow .15s}
.outfit-card:hover{box-shadow:var(--shadow)}
.outfit-card-top{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.outfit-tag{padding:2px 10px;border-radius:12px;font-size:11px;font-weight:700;color:#fff}
.outfit-time{font-size:12px;color:var(--text-3);margin-left:auto}
.outfit-items{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.outfit-item-chip{display:flex;flex-direction:column;align-items:center;gap:3px;width:60px}
.outfit-item-chip img{width:56px;height:56px;border-radius:var(--r-xs);object-fit:cover;border:1px solid var(--border-l)}
.outfit-item-chip span{font-size:11px;color:var(--text-2);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:60px}
.outfit-note{font-size:13px;color:var(--text-2);margin-top:6px;white-space:pre-wrap}
.outfit-actions{display:flex;gap:6px;margin-top:10px;padding-top:10px;border-top:1px solid var(--border-l)}
.outfit-detail-items{display:flex;flex-direction:column;gap:10px;margin:10px 0}
.outfit-detail-item{display:flex;gap:10px;align-items:center;background:var(--bg);border-radius:var(--r-xs);padding:8px}
.outfit-detail-item img{width:52px;height:52px;border-radius:var(--r-xs);object-fit:cover;flex-shrink:0}
.tag-chips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 4px}
.tag-chip{padding:6px 14px;border-radius:20px;font-size:13px;font-weight:600;background:var(--surface);border:1px solid var(--border);color:var(--text-2);cursor:pointer;transition:all .15s}
.tag-chip:hover{border-color:var(--primary)}
.tag-chip.active{color:#fff;border-color:transparent}
/* ===== 阶段计划 ===== */
.phase-list{display:flex;flex-direction:column;gap:12px}
.phase-plan-card{background:var(--surface);border-radius:var(--r);padding:16px;box-shadow:var(--shadow-sm);transition:box-shadow .2s;cursor:pointer;position:relative}
.phase-plan-card:hover{box-shadow:var(--shadow)}
.phase-plan-card .pp-del{position:absolute;top:10px;right:10px;width:24px;height:24px;border-radius:50%;background:var(--border-l);color:var(--danger);font-size:16px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.phase-plan-card .pp-del:hover{background:var(--danger);color:#fff}
.phase-plan-card .pp-name{font-size:16px;font-weight:600;margin-bottom:4px}
/* ===== 成长管理 ===== */
.growth-modules{display:flex;flex-direction:column;gap:12px;margin-top:6px}
.growth-module-card{background:var(--surface);border-radius:var(--r);padding:16px;box-shadow:var(--shadow-sm);transition:box-shadow .2s;cursor:pointer}
.growth-module-card:hover{box-shadow:var(--shadow)}
.gm-head{display:flex;align-items:center;gap:12px}
.gm-icon{font-size:26px}
.gm-title{font-size:16px;font-weight:700}
.gm-arrow{margin-left:auto;color:var(--text-3);font-size:20px}
.gm-stats{display:flex;flex-wrap:wrap;gap:10px 20px;margin-top:10px;align-items:flex-end}
.gm-stat{display:flex;flex-direction:column;line-height:1.3}
.gm-stat-num{font-size:18px;font-weight:700;color:var(--primary)}
.gm-stat-label{font-size:12px;color:var(--text-2)}
.growth-chips{display:flex;flex-wrap:wrap;gap:6px}
.growth-chip{font-size:12px;padding:3px 9px;border-radius:20px;background:var(--primary-light);color:var(--primary)}
.growth-chip.ab{background:#fef2f2;color:var(--danger)}
.growth-chk{display:inline-flex;align-items:center;gap:4px;font-size:13px;color:var(--text-2);background:var(--border-l);padding:5px 10px;border-radius:20px}
.growth-chk input{width:14px;height:14px;accent-color:var(--primary)}
.growth-row{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--text-2);margin-top:4px}
.growth-record-date{font-weight:600;color:var(--text)}
.input-card label{display:block;font-size:13px;color:var(--text-2);margin:10px 0 4px}
.input-card label:first-child{margin-top:0}
.input-card input,.input-card textarea,.input-card select{width:100%;border:1px solid var(--border);border-radius:var(--r-s);padding:8px 12px;font-size:14px;background:var(--bg);box-sizing:border-box}
.input-card textarea{resize:vertical}
.growth-dur-preview{margin-top:10px;font-size:13px;color:var(--text-3);background:var(--border-l);padding:9px 12px;border-radius:var(--r-s);text-align:center}
.growth-dur-preview.active{color:var(--primary);background:var(--primary-light);font-weight:600}
.phase-plan-card .pp-date{font-size:12px;color:var(--text-2);margin-bottom:10px}
.phase-plan-card .pp-meta{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--text-3);margin-top:8px}
.progress-wrap{background:var(--border-l);border-radius:20px;height:8px;overflow:hidden;flex:1}
.progress-fill{height:100%;background:var(--primary);border-radius:20px;transition:width .25s}
.prog-row{display:flex;align-items:center;gap:10px}
.prog-row .prog-num{width:58px;flex-shrink:0;display:flex;align-items:center;gap:2px;justify-content:flex-end}
.prog-row .prog-num input{width:46px;border:1px solid var(--border);border-radius:6px;padding:4px 6px;font-size:13px;background:var(--bg);text-align:center}
.phase-items{display:flex;flex-direction:column;gap:10px;margin:10px 0}

.phase-item .pi-top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
.phase-item .pi-text{font-size:14px;font-weight:500;word-break:break-word}
.phase-item .pi-del{color:var(--danger);font-size:18px;cursor:pointer;flex-shrink:0;width:22px;height:22px;display:flex;align-items:center;justify-content:center}

.phase-cal-day.today{font-weight:700;color:var(--primary)}
.phase-cal-day.selected{background:var(--primary);color:#fff}
.phase-cal-day.has::after{content:'';position:absolute;bottom:5px;width:4px;height:4px;border-radius:50%;background:var(--primary)}
.phase-cal-day.selected.has::after{background:#fff}
.phase-daily-list .phase-daily-item{background:var(--bg);border-radius:var(--r-s);padding:10px 12px;margin-bottom:8px;font-size:14px;display:flex;justify-content:space-between;align-items:center;gap:8px}

      </div>
      <div class="tab-content" id="tab-phase">

            <button class="back-btn" id="phaseBackList">‹</button>

            <span style="margin-left:auto;display:flex;gap:8px">

        </div>
      </div>

            <div class="org-stat-card"><div class="org-stat-num" id="orgCatCount">0</div><div class="org-stat-label">物品分类</div></div>
            <div class="org-stat-card clickable" onclick="openOrgFilter('pending')"><div class="org-stat-num" id="orgPendingCount" style="color:#92400e">0</div><div class="org-stat-label">待处理 ›</div></div>

<script>
// ===== IndexedDB: 替代服务器，数据持久化在浏览器 =====
const DB={
  _db:null,
  init(){return new Promise((resolve,reject)=>{
    const req=indexedDB.open('daily-workspace',1);
    req.onupgradeneeded=e=>{const db=e.target.result;if(!db.objectStoreNames.contains('kv'))db.createObjectStore('kv')};
    req.onsuccess=e=>{this._db=e.target.result;resolve()};
    req.onerror=e=>reject(e.target.error)
  })},
  get(key){return new Promise((resolve,reject)=>{const tx=this._db.transaction('kv','readonly');const req=tx.objectStore('kv').get(key);req.onsuccess=()=>resolve(req.result??null);req.onerror=()=>reject(req.error)})},
  set(key,val){return new Promise((resolve,reject)=>{const tx=this._db.transaction('kv','readwrite');tx.objectStore('kv').put(val,key);tx.oncomplete=()=>resolve();tx.onerror=()=>reject(tx.error)})},
  del(key){return new Promise((resolve,reject)=>{const tx=this._db.transaction('kv','readwrite');tx.objectStore('kv').delete(key);tx.oncomplete=()=>resolve();tx.onerror=()=>reject(tx.error)})},
  keys(){return new Promise((resolve,reject)=>{const tx=this._db.transaction('kv','readonly');const req=tx.objectStore('kv').getAllKeys();req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}
};

const S={tab:'daily',date:fmtYMD(new Date()),boards:[],daily:{},insp:[],org:[],orgCategories:[],orgCurrentCat:null,orgCurrentLocation:null,orgFilter:null,outfits:[],outfitCart:[],outfitLocExpanded:{},pendingImgs:{insp:[],org:[]},edit:null,deferredPrompt:null,phasePlans:[],phaseCurrentId:null,phaseSelDate:null,phaseCalMonth:null,growthSleep:[],growthDiet:[],growthOut:[],growthModule:null};

function genId(){return new Date().toISOString().replace(/[-:T]/g,'').slice(0,14)+Math.random().toString(36).substr(2,6)}
function nowISO(){return new Date().toISOString()}
function fmtDate(iso){const d=new Date(iso);const p=n=>String(n).padStart(2,'0');return`${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`}
function fmtDateCN(s){if(!s)return'';const d=s.includes('T')?new Date(s):new Date(s+'T00:00:00');if(isNaN(d.getTime()))return'';const t=new Date();const diff=Math.floor((t.setHours(0,0,0,0)-new Date(d).setHours(0,0,0,0))/86400000);if(diff===0)return'今天';if(diff===1)return'昨天';if(diff===-1)return'明天';return`${d.getMonth()+1}月${d.getDate()}日 周${'日一二三四五六'[d.getDay()]}`}
function showToast(msg,type=''){const t=document.getElementById('toast');t.textContent=msg;t.className='toast show '+type;setTimeout(()=>t.classList.remove('show'),2500)}
function escapeHtml(s){return(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}

function compressImage(file,maxW=1200,quality=0.8){return new Promise(resolve=>{const reader=new FileReader();reader.onload=e=>{const img=new Image();img.onload=()=>{let w=img.width,h=img.height;if(w>maxW){h=h*maxW/w;w=maxW}const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);resolve(c.toDataURL('image/jpeg',quality))};img.src=e.target.result};reader.readAsDataURL(file)})}
async function handleFiles(input,type){const files=Array.from(input.files);for(const f of files){if(!f.type.startsWith('image/'))continue;S.pendingImgs[type].push(await compressImage(f))}input.value='';renderPendingImgs(type)}
function renderPendingImgs(type){const c=document.getElementById(type==='insp'?'inspImgPreview':'orgImgPreview');c.innerHTML=S.pendingImgs[type].map((src,i)=>`<div class="image-preview-item"><img src="${src}" alt=""><div class="remove-img" onclick="removePendingImg('${type}',${i})">×</div></div>`).join('')}

async function loadBoards(){const b=await DB.get('boards');if(b&&b.length){S.boards=b}else{S.boards=[...DEFAULT_BOARDS];await DB.set('boards',S.boards)}}
async function loadDaily(){S.daily=(await DB.get('daily:'+S.date))||{};await carryOverUncompleted();renderBoards()}
// 未完成的任务自动顺延到下一天，直到完成
async function carryOverUncompleted(){
  let changed=false;
  // 1) 清理当天可能存在的同文本重复（修复旧数据/跨天复制产生的重复）
  for(const bid in S.daily){
    const seen={};const before=(S.daily[bid]||[]).length;
    S.daily[bid]=(S.daily[bid]||[]).filter(t=>{const k=t.text;if(seen[k])return false;seen[k]=true;return true});
    if((S.daily[bid]||[]).length!==before)changed=true;
  }
  // 2) 扫描最近60天，按稳定 id（有 id 用 id，旧任务用 文本 兜底）追踪每个任务最近一次状态
  const allKeys=await DB.keys();
  const prevDates=allKeys.filter(k=>k.startsWith('daily:')).map(k=>k.slice(6)).filter(d=>d<S.date).sort().reverse();
  if(prevDates.length===0){if(changed)await saveDaily();return}
  const scanDates=prevDates.slice(0,60);
  const taskMap={};
  for(const d of scanDates){
    const data=await DB.get('daily:'+d);if(!data)continue;
    for(const boardId in data){
      const tasks=data[boardId];if(!Array.isArray(tasks))continue;
      for(const t of tasks){
        const tid=t.id||('txt:'+t.text);
        if(!taskMap[tid]||d>taskMap[tid].date){taskMap[tid]={date:d,done:!!t.done,dismissed:!!t.dismissed,task:t,boardId}}
      }
    }
  }
  // 3) 未完成的任务顺延到当天（使用稳定 id，不再生成随机 id，避免跨天复制产生重复）
  for(const tid in taskMap){
    const{date,done,dismissed,task,boardId}=taskMap[tid];
    if(done||dismissed)continue; // 已完成或已删除，不再顺延
    if(!S.daily[boardId])S.daily[boardId]=[];
    if(S.daily[boardId].some(t=>t.text===task.text))continue; // 当天已有同名任务则不重复添加
    S.daily[boardId].push({id:tid,text:task.text,done:false,carriedFrom:date});
    changed=true;
  }
  if(changed)await saveDaily();
}
function renderBoards(){const g=document.getElementById('boardsGrid');g.innerHTML=S.boards.map(board=>{const tasks=(S.daily[board.id]||[]);return`<div class="board-card"><div class="board-header"><input class="board-name" value="${escapeHtml(board.name)}" data-board="${board.id}" maxlength="20"></div><div class="task-list">${tasks.map((t,i)=>`<div class="task-item ${t.done?'done':''}"><div class="task-checkbox ${t.done?'checked':''}" onclick="toggleTask('${board.id}',${i})"></div><span class="task-text" onclick="toggleTask('${board.id}',${i})">${t.carriedFrom?`<span class="task-carry" title="来自${fmtDateCN(t.carriedFrom)}的未完成事项">🔄</span> `:''}${escapeHtml(t.text)}</span><button class="task-delete" onclick="deleteTask('${board.id}',${i})">×</button></div>`).join('')}</div><div class="add-task"><input type="text" placeholder="添加待办事项..." id="add-input-${board.id}" onkeypress="if(event.key==='Enter')addTask('${board.id}')"><button onclick="addTask('${board.id}')">+</button></div></div>`}).join('');g.querySelectorAll('.board-name').forEach(input=>{input.addEventListener('change',()=>{const bid=input.dataset.board;const board=S.boards.find(b=>b.id===bid);if(board){board.name=input.value.trim()||'未命名';input.value=board.name;saveBoards()}})})}
async function saveBoards(){await DB.set('boards',S.boards)}
async function saveDaily(){const data={};S.boards.forEach(b=>{if(S.daily[b.id]&&S.daily[b.id].length>0)data[b.id]=S.daily[b.id]});await DB.set('daily:'+S.date,data);S.daily=data}
function addTask(boardId){const input=document.getElementById('add-input-'+boardId);const text=input.value.trim();if(!text)return;if(!S.daily[boardId])S.daily[boardId]=[];S.daily[boardId].push({id:genId(),text,done:false});input.value='';renderBoards();saveDaily()}
function toggleTask(boardId,idx){S.daily[boardId][idx].done=!S.daily[boardId][idx].done;renderBoards();saveDaily()}
async function deleteTask(boardId,idx){
  const task=S.daily[boardId]&&S.daily[boardId][idx];if(!task)return;
  S.daily[boardId].splice(idx,1);renderBoards();saveDaily();
  // 标记之前所有日期的同名任务为 dismissed，防止删除后再次顺延
  const tid=task.id||('txt:'+task.text);
  const allKeys=await DB.keys();
  const prevDates=allKeys.filter(k=>k.startsWith('daily:')).map(k=>k.slice(6)).filter(d=>d<S.date);
  for(const d of prevDates){
    const data=await DB.get('daily:'+d);if(!data)continue;
    let modified=false;
    for(const bid in data){if(!Array.isArray(data[bid]))continue;for(const t of data[bid]){if((t.id||('txt:'+t.text))===tid&&!t.done){t.dismissed=true;modified=true}}}
    if(modified)await DB.set('daily:'+d,data);
  }
}
function fmtYMD(d){const y=d.getFullYear();const m=String(d.getMonth()+1).padStart(2,'0');const day=String(d.getDate()).padStart(2,'0');return y+'-'+m+'-'+day}
function shiftDate(days){const [y,m,dd]=S.date.split('-').map(Number);const d=new Date(y,m-1,dd);d.setDate(d.getDate()+days);S.date=fmtYMD(d);document.getElementById('datePicker').value=S.date;loadDaily()}
document.getElementById('prevDay').addEventListener('click',()=>shiftDate(-1));
document.getElementById('nextDay').addEventListener('click',()=>shiftDate(1));
document.getElementById('todayBtn').addEventListener('click',()=>{S.date=fmtYMD(new Date());document.getElementById('datePicker').value=S.date;loadDaily()});

    return (b.timestamp||'').localeCompare(a.timestamp||'');

}

// Layer 1: Overview
function renderOrgOverview(){
  const total=S.org.length;const catCount=S.orgCategories.length;
  const pending=S.org.filter(r=>r.status==='pending').length;
  const done=S.org.filter(r=>r.status==='done').length;
  document.getElementById('orgTotalCount').textContent=total;
  document.getElementById('orgCatCount').textContent=catCount;
  document.getElementById('orgPendingCount').textContent=pending;
  document.getElementById('orgDoneCount').textContent=done;
  const list=document.getElementById('orgCatList');
  const counts={};S.org.forEach(r=>{counts[r.category]=(counts[r.category]||0)+1});
  if(S.orgCategories.length===0){list.innerHTML='<div class="empty" style="padding:30px 20px"><p>还没有分类<br>点击上方"新增分类"添加</p></div>';return}
  list.innerHTML=S.orgCategories.map(cat=>{
    const count=counts[cat.name]||0;
    return `<div class="org-cat-item" data-id="${cat.id}" onclick="openOrgCategory('${cat.id}')"><span class="cat-handle" title="拖动排序" onclick="event.stopPropagation()">⠿</span><span class="cat-icon">${cat.icon}</span><span class="cat-name">${escapeHtml(cat.name)}</span><span class="cat-count">${count} 件</span><span class="cat-del" onclick="event.stopPropagation();deleteOrgCategory('${cat.id}')">×</span><span class="cat-arrow">›</span></div>`
  }).join('');
}
// 分类（品类）拖动排序：按住左侧 ⠿ 手柄上下拖动即可重排，桌面/触屏通用
let _drag=null;
(function initOrgCatDrag(){
  const list=document.getElementById('orgCatList');if(!list)return;
  list.addEventListener('pointerdown',e=>{
    const h=e.target.closest('.cat-handle');if(!h)return;
    const item=h.closest('.org-cat-item');if(!item)return;
    e.preventDefault();
    _drag={id:item.dataset.id,item,startY:e.clientY,moved:false,pid:e.pointerId};
    try{item.setPointerCapture(e.pointerId)}catch(_){}
    item.classList.add('dragging');
  });
  list.addEventListener('pointermove',e=>{
    if(!_drag)return;
    const dy=e.clientY-_drag.startY;
    if(Math.abs(dy)>4)_drag.moved=true;
    _drag.item.style.transform='translateY('+dy+'px)';
    list.querySelectorAll('.org-cat-item').forEach(it=>{if(it!==_drag.item)it.classList.remove('drop-before','drop-after')});
    const others=[...list.querySelectorAll('.org-cat-item')].filter(it=>it!==_drag.item);
    for(const it of others){const r=it.getBoundingClientRect();if(e.clientY>=r.top&&e.clientY<=r.bottom){it.classList.add(e.clientY<r.top+r.height/2?'drop-before':'drop-after');break}}
  });
  const end=async()=>{
    if(!_drag)return;
    const {id,item,moved}=_drag;
    item.style.transform='';item.classList.remove('dragging');
    const before=list.querySelector('.drop-before'),after=list.querySelector('.drop-after');
    list.querySelectorAll('.org-cat-item').forEach(it=>it.classList.remove('drop-before','drop-after'));
    _drag=null;
    if(!moved){return}
    const ref=before||after;if(!ref||ref.dataset.id===id){renderOrgOverview();return}
    const from=S.orgCategories.findIndex(c=>c.id===id);if(from<0){renderOrgOverview();return}
    const [m]=S.orgCategories.splice(from,1);
    let refIdx=S.orgCategories.findIndex(c=>c.id===ref.dataset.id);if(refIdx<0)refIdx=0;
    if(after)refIdx+=1;
    S.orgCategories.splice(refIdx,0,m);
    await DB.set('orgCategories',S.orgCategories);renderOrgOverview();showToast('已调整顺序','success');
  };
  list.addEventListener('pointerup',end);
  list.addEventListener('pointercancel',()=>{if(_drag){_drag.item.style.transform='';_drag.item.classList.remove('dragging');list.querySelectorAll('.org-cat-item').forEach(it=>it.classList.remove('drop-before','drop-after'));_drag=null;renderOrgOverview()}});
})();

// 「其他」分类一键清空
async function clearOrgOther(){
  if(!confirm('确定清空「其他」分类下的所有物品记录吗？\n此操作不可恢复！'))return;
  S.org=S.org.filter(r=>r.category!=='其他');
  await DB.set('organizing',S.org);
  showToast('已清空「其他」分类','success');renderOrgItems();renderOrgOverview();renderOrgLocations();
}
function renderOrgLocations(){
  const cat=S.orgCategories.find(c=>c.id===S.orgCurrentCat);if(!cat)return;
  const container=document.getElementById('orgLocationGroups');
  const records=S.org.filter(r=>r.category===cat.name);
  const locGroups={};
  records.forEach(r=>{const loc=r.location||'未指定位置';if(!locGroups[loc])locGroups[loc]=[];locGroups[loc].push(r)});
  orgLocationNames=Object.keys(locGroups);
  let html='';
  if(orgLocationNames.length===0){
    html=`<div class="empty"><div class="empty-icon">${cat.icon}</div><p>这个分类还没有物品<br>点击下方按钮添加第一件</p></div>`;
  }else{
    html=orgLocationNames.map((loc,i)=>{
      const items=locGroups[loc];const pend=items.filter(r=>r.status==='pending').length;
      return `<div class="org-location-group" onclick="openOrgLocation(${i})"><span class="loc-icon">📍</span><span class="loc-name">${escapeHtml(loc)}</span><span class="loc-count">${items.length} 件${pend>0?' · '+pend+'待处理':''}</span><span class="loc-arrow">›</span></div>`;
    }).join('');
  }
  html+=`<button class="btn btn-primary" style="width:100%;margin-top:12px" onclick="openOrgLocationWithForm()">+ 添加物品</button>`;
  // 衣物分类下额外提供「日常穿搭」模块入口
  if(cat.name==='衣物'){
    const count=S.outfits.length;
    html=`<div class="outfit-entry" onclick="openOutfitBuilder()"><span class="cat-icon">🧥</span><span class="cat-name">日常穿搭${count>0?` · ${count} 套`:''}</span><span class="cat-arrow">›</span></div>`+html;
  }
  container.innerHTML=html;
  // 「其他」分类在位置分组视图头部也显示一键清空
  const locClear=document.getElementById('orgClearOtherLoc');
  if(locClear)locClear.style.display=(cat.name==='其他')?'inline-flex':'none';
}

function openOrgLocationWithForm(){
  S.orgFilter=null;S.orgCurrentLocation=null;
  const cat=S.orgCategories.find(c=>c.id===S.orgCurrentCat);
  document.getElementById('orgLocationView').style.display='none';
  document.getElementById('orgItemView').style.display='block';
  document.querySelector('#orgItemView .input-card').style.display='block';
  document.getElementById('orgItemTitle').innerHTML=`<span>${cat.icon}</span> ${escapeHtml(cat.name)} <span style="color:var(--text-3);font-size:14px">/ 新增物品</span>`;
  document.getElementById('orgLocation').value='';
  renderOrgItems();
}
function closeOrgToLocation(){
  S.orgCurrentLocation=null;
  document.getElementById('orgLocationView').style.display='block';
  document.getElementById('orgItemView').style.display='none';
  renderOrgLocations();
}
function renderOrgItems(){
  const list=document.getElementById('orgItemList');
  let records,cat=null;
  const order={pending:0,none:1,done:2};
  if(S.orgFilter){
    records=S.org.filter(r=>r.status===S.orgFilter);
    records.sort((a,b)=>(b.timestamp||'').localeCompare(a.timestamp||''));
  }else{
    cat=S.orgCategories.find(c=>c.id===S.orgCurrentCat);if(!cat)return;
    records=S.org.filter(r=>r.category===cat.name);
    if(S.orgCurrentLocation){records=records.filter(r=>(r.location||'未指定位置')===S.orgCurrentLocation)}
    records.sort((a,b)=>{const oa=order[a.status||'none'],ob=order[b.status||'none'];if(oa!==ob)return oa-ob;return (b.timestamp||'').localeCompare(a.timestamp||'')});
  }
  // 「其他」分类显示一键清空按钮
  const clearBtn=document.getElementById('orgClearOther');
  if(clearBtn)clearBtn.style.display=(!S.orgFilter&&cat&&cat.name==='其他')?'inline-flex':'none';
  if(records.length===0){list.innerHTML=`<div class="empty"><div class="empty-icon">${cat?cat.icon:'📦'}</div><p>${S.orgFilter?(S.orgFilter==='pending'?'没有待处理的物品':'没有已处理的物品'):'这里还没有物品<br>在上方添加第一件吧'}</p></div>`;return}
  list.innerHTML=records.map(r=>{
    const st=r.status||'none';const stCls=st==='done'?'done':st==='pending'?'pending':'none';const stText=st==='done'?'✓ 已处理':st==='pending'?'⏳ 待处理':'○ 无需处理';
    return `<div class="record-card"><div class="record-meta"><span class="record-status ${stCls}" onclick="toggleOrgStatus('${r.id}')">${stText}</span><span class="record-time">${fmtDate(r.timestamp)}</span></div>${r.title?`<div class="record-title">${escapeHtml(r.title)}</div>`:''}${r.text?`<div class="record-text">${escapeHtml(r.text)}</div>`:''}${r.location?`<div class="record-location">📍 ${escapeHtml(r.location)}</div>`:''}${r.images&&r.images.length?`<div class="record-images">${r.images.map(src=>`<img src="${src}" onclick="openLightbox('${src.replace(/'/g,"\\'")}')" alt="">`).join('')}</div>`:''}<div class="record-actions"><button class="btn btn-ghost btn-sm" onclick="editOrg('${r.id}')">编辑</button><button class="btn btn-danger btn-sm" onclick="delOrg('${r.id}')">删除</button></div></div>`;
  }).join('');
}
async function toggleOrgStatus(id){const r=S.org.find(x=>x.id===id);if(!r)return;const cur=r.status||'none';r.status=cur==='none'?'pending':cur==='pending'?'done':'none';await DB.set('organizing',S.org);renderOrgItems();renderOrgOverview()}
document.getElementById('orgFileInput').addEventListener('change',e=>handleFiles(e.target,'org'));
document.getElementById('submitOrg').addEventListener('click',async()=>{
  const cat=S.orgCategories.find(c=>c.id===S.orgCurrentCat);if(!cat){showToast('请先选择一个分类','error');return}
  const title=document.getElementById('orgTitle').value.trim();const text=document.getElementById('orgText').value.trim();const location=document.getElementById('orgLocation').value.trim();const status=document.getElementById('orgStatus').value;const images=[...S.pendingImgs.org];
  if(!title&&!text&&images.length===0){showToast('请输入内容','error');return}
  const rec={id:genId(),timestamp:nowISO(),category:cat.name,title,text,location,images,status};
  S.org.unshift(rec);await DB.set('organizing',S.org);

async function delOrg(id){if(!confirm('确定删除这条物品记录吗？'))return;S.org=S.org.filter(r=>r.id!==id);await DB.set('organizing',S.org);showToast('已删除','success');renderOrgItems()}
function editOrg(id){
  const r=S.org.find(x=>x.id===id);if(!r)return;S.edit={type:'org',id,images:[...(r.images||[])]};
  const catOptions=S.orgCategories.map(c=>`<option value="${c.name}" ${r.category===c.name?'selected':''}>${c.icon} ${c.name}</option>`).join('');
  const statusOptions=`<option value="none" ${(r.status||'none')==='none'?'selected':''}>○ 无需处理</option><option value="pending" ${r.status==='pending'?'selected':''}>⏳ 待处理</option><option value="done" ${r.status==='done'?'selected':''}>✓ 已处理</option>`;
  openEditModal('编辑物品记录',`<label>分类</label><select id="edit-category">${catOptions}</select><label>状态</label><select id="edit-status">${statusOptions}</select><label>物品名称</label><input type="text" id="edit-title" value="${escapeHtml(r.title||'')}"><label>描述</label><textarea id="edit-text" rows="4">${escapeHtml(r.text||'')}</textarea><label>存放位置</label><input type="text" id="edit-location" value="${escapeHtml(r.location||'')}"><label>图片</label><div class="image-preview" id="edit-img-preview"></div><label class="upload-btn" style="display:inline-flex;margin-top:8px">📷 添加图片<input type="file" accept="image/*" multiple id="edit-file-input"></label>`);
  renderEditImgs();document.getElementById('edit-file-input').addEventListener('change',async e=>{const files=Array.from(e.target.files);for(const f of files){if(f.type.startsWith('image/'))S.edit.images.push(await compressImage(f))}renderEditImgs();e.target.value=''});
}

// ===== 日常穿搭模块 (Outfit) =====
const OUTFIT_TAGS=['工作','日常','约会','旅游'];
const TAG_COLORS={'工作':'#6366f1','日常':'#10b981','约会':'#ec4899','旅游':'#f59e0b'};
function tagColor(t){return TAG_COLORS[t]||'#6b7280'}
async function loadOutfits(){S.outfits=(await DB.get('outfits'))||[]}
// 进入穿搭构建器：列出所有衣物单品供勾选
function openOutfitBuilder(){
  S.orgCurrentLocation=null;
  document.getElementById('orgOverviewView').style.display='none';
  document.getElementById('orgLocationView').style.display='none';
  document.getElementById('orgItemView').style.display='none';
  document.getElementById('orgOutfitListView').style.display='none';
  document.getElementById('orgOutfitView').style.display='block';
  renderOutfitBuilder();
}
let outfitLocNames=[];
function renderOutfitBuilder(){
  const list=document.getElementById('orgOutfitBuilder');
  const clothes=S.org.filter(r=>r.category==='衣物');
  if(clothes.length===0){
    list.innerHTML='<div class="empty"><div class="empty-icon">👕</div><p>还没有衣物单品<br>先在「衣物」分类下添加一些衣物吧</p></div>';
    document.getElementById('outfitCart').style.display='none';
    return;
  }
  // 按位置分组（与衣物清单的位置分组保持一致）
  const groups={};
  clothes.forEach(r=>{const loc=(r.location&&r.location.trim())||'未指定位置';(groups[loc]=groups[loc]||[]).push(r)});
  let locNames=Object.keys(groups);
  locNames.sort((a,b)=>{const ua=a==='未指定位置'?1:0,ub=b==='未指定位置'?1:0;if(ua!==ub)return ua-ub;return a.localeCompare(b,'zh')});
  outfitLocNames=locNames;
  list.innerHTML=locNames.map((loc,i)=>{
    const items=groups[loc];
    const collapsed=!S.outfitLocExpanded[loc];
    const selCount=items.filter(r=>S.outfitCart.includes(r.id)).length;
    const cards=collapsed?'':items.map(r=>{
      const sel=S.outfitCart.includes(r.id);
      const thumb=r.images&&r.images.length?`<img class="sel-thumb" src="${r.images[0]}" alt="">`:`<div class="sel-thumb" style="display:flex;align-items:center;justify-content:center;font-size:22px">👕</div>`;
      return `<div class="outfit-sel ${sel?'selected':''}" onclick="toggleOutfitItem('${r.id}')"><div class="sel-check">${sel?'✓':''}</div>${thumb}<div class="sel-info"><div class="sel-title">${escapeHtml(r.title||'(未命名)')}</div><div class="sel-sub">${escapeHtml((r.text||''))}</div></div></div>`;
    }).join('');
    return `<div class="outfit-group">
      <div class="outfit-group-title loc-toggle" onclick="toggleOutfitLoc(${i})">
        <span style="font-size:16px">📍</span>
        <span>${escapeHtml(loc)}</span>
        <span style="color:var(--text-3);font-weight:400;font-size:12px">${items.length} 件</span>
        ${selCount>0?`<span class="loc-sel">· ${selCount} 已选</span>`:''}
        <span style="margin-left:auto;font-size:14px;transition:transform .15s;transform:${collapsed?'rotate(-90deg)':'none'}">▾</span>
      </div>
      ${cards}
    </div>`;
  }).join('');
  // 购物车栏
  const cart=document.getElementById('outfitCart');
  document.getElementById('outfitCartCount').textContent='已选 '+S.outfitCart.length+' 件';
  cart.style.display=S.outfitCart.length>0?'flex':'none';
}
// 折叠/展开某个位置分组（默认折叠，手动点击展开）
function toggleOutfitLoc(i){
  const loc=outfitLocNames[i];if(loc==null)return;
  S.outfitLocExpanded[loc]=!S.outfitLocExpanded[loc];
  renderOutfitBuilder();
}
function toggleOutfitItem(id){
  const i=S.outfitCart.indexOf(id);
  if(i>=0)S.outfitCart.splice(i,1);else S.outfitCart.push(id);
  renderOutfitBuilder();
}
function clearOutfitCart(){S.outfitCart=[];renderOutfitBuilder()}
// 确认生成穿搭：弹出标签/标题/备注选择
function confirmOutfit(){
  if(S.outfitCart.length===0){showToast('请先勾选至少一件衣物','error');return}
  let chips=OUTFIT_TAGS.map((t,i)=>`<span class="tag-chip ${i===0?'active':''}" data-tag="${t}" style="background:${i===0?tagColor(t):'var(--surface)'}" onclick="selectOutfitTag('${t}')">${t}</span>`).join('');
  openEditModal('生成穿搭清单',`<label>选择标签</label><div class="tag-chips" id="outfit-tag-chips">${chips}</div><label>清单标题（可选）</label><input type="text" id="outfit-title" placeholder="如：周一通勤穿搭" maxlength="30"><label>备注（可选）</label><textarea id="outfit-note" rows="3" placeholder="如：搭配小白鞋+手表"></textarea>`);
  S._outfitTag=OUTFIT_TAGS[0];
  document.getElementById('saveEdit').onclick=()=>{
    const title=document.getElementById('outfit-title').value.trim();
    const note=document.getElementById('outfit-note').value.trim();
    const items=S.outfitCart.map(rid=>{const r=S.org.find(x=>x.id===rid);return r?{rid,category:r.category,title:r.title||'',text:r.text||'',location:r.location||'',image:(r.images&&r.images[0])||''}:null}).filter(Boolean);
    if(items.length===0){showToast('请先勾选衣物','error');return}
    S.outfits.unshift({id:genId(),timestamp:nowISO(),tag:S._outfitTag,title,note,items});
    DB.set('outfits',S.outfits).then(()=>{showToast('穿搭已保存','success')});
    S.outfitCart=[];
    closeEditModal();
    document.getElementById('saveEdit').onclick=null;
    renderOrgLocations(); // 刷新入口上的套数
    openOutfitList();
  };
}
function selectOutfitTag(t){
  S._outfitTag=t;
  document.querySelectorAll('#outfit-tag-chips .tag-chip').forEach(c=>{
    const on=c.dataset.tag===t;
    c.classList.toggle('active',on);
    c.style.background=on?tagColor(t):'var(--surface)';
  });
}
// 我的穿搭列表（按标签分组）
function openOutfitList(){
  document.getElementById('orgOverviewView').style.display='none';
  document.getElementById('orgLocationView').style.display='none';
  document.getElementById('orgItemView').style.display='none';
  document.getElementById('orgOutfitView').style.display='none';
  document.getElementById('orgOutfitListView').style.display='block';
  renderOutfitList();
}
function renderOutfitList(){
  const wrap=document.getElementById('orgOutfitList');
  if(S.outfits.length===0){
    wrap.innerHTML='<div class="empty"><div class="empty-icon">🧥</div><p>还没有穿搭清单<br>进入「日常穿搭」勾选衣物生成第一套吧</p></div>';
    return;
  }
  const groups={};
  S.outfits.forEach(o=>{(groups[o.tag]=groups[o.tag]||[]).push(o)});
  const order=OUTFIT_TAGS.concat(Object.keys(groups).filter(t=>!OUTFIT_TAGS.includes(t)));
  wrap.innerHTML=order.filter(t=>groups[t]).map(t=>{
    const list=groups[t].slice().sort((a,b)=>{
      const r=(b.rating||0)-(a.rating||0); // 评分高的排前面，未评分(0)排最后
      if(r!==0)return r;
      return (b.timestamp||'').localeCompare(a.timestamp||''); // 评分相同则新的在前
    });
    return `<div class="outfit-group"><div class="outfit-group-title"><span class="outfit-tag" style="background:${tagColor(t)}">${t}</span><span style="color:var(--text-3);font-weight:400;font-size:12px">${list.length} 套</span></div>${list.map(o=>renderOutfitCard(o)).join('')}</div>`;
  }).join('');
}
// 评分星星（点击打分，再次点同一颗取消）。卡片/查看/编辑弹窗共用
function starsHTML(o,withId){
  const r=o.rating||0;
  const idAttr=withId?' id="outfitStarsBox"':'';
  return `<div${idAttr} style="font-size:19px;letter-spacing:1px;cursor:pointer;user-select:none;line-height:1" title="点击星星打分">${[1,2,3,4,5].map(i=>`<span onclick="setOutfitRating('${o.id}',${i})" style="color:${i<=r?'#f59e0b':'#d1d5db'};transition:color .1s">${i<=r?'★':'☆'}</span>`).join('')}</div>`;
}
function setOutfitRating(id,n){
  const o=S.outfits.find(x=>x.id===id);if(!o)return;
  o.rating=(o.rating===n)?0:n; // 再次点同一颗则取消评分
  DB.set('outfits',S.outfits).then(()=>{
    renderOutfitList();
    const box=document.getElementById('outfitStarsBox');
    if(box){const cur=S.outfits.find(x=>x.id===id);if(cur)box.innerHTML=starsHTML(cur);}
  });
}
function renderOutfitCard(o){
  const chips=o.items.map(it=>`<div class="outfit-item-chip">${it.image?`<img src="${it.image}" alt="">`:'<div style="width:56px;height:56px;border-radius:6px;background:var(--border-l);display:flex;align-items:center;justify-content:center">👕</div>'}<span>${escapeHtml(it.title||'')}</span></div>`).join('');
  return `<div class="outfit-card"><div class="outfit-card-top"><span class="outfit-tag" style="background:${tagColor(o.tag)}">${o.tag}</span>${o.title?`<strong style="font-size:14px">${escapeHtml(o.title)}</strong>`:''}<span class="outfit-time">${fmtDateCN(o.timestamp)}</span></div>${starsHTML(o)}<div class="outfit-items">${chips}</div>${o.note?`<div class="outfit-note">${escapeHtml(o.note)}</div>`:''}<div class="outfit-actions"><button class="btn btn-ghost btn-sm" onclick="viewOutfit('${o.id}')">查看</button><button class="btn btn-ghost btn-sm" onclick="editOutfit('${o.id}')">编辑</button><button class="btn btn-danger btn-sm" onclick="delOutfit('${o.id}')">删除</button></div></div>`;
}
function viewOutfit(id){
  const o=S.outfits.find(x=>x.id===id);if(!o)return;
  const items=o.items.map(it=>`<div class="outfit-detail-item">${it.image?`<img src="${it.image}" alt="">`:'<div style="width:52px;height:52px;border-radius:6px;background:var(--border-l);display:flex;align-items:center;justify-content:center">👕</div>'}<div style="flex:1;min-width:0"><div style="font-size:14px;font-weight:600">${escapeHtml(it.title||'')}</div>${it.location||it.text?`<div style="font-size:12px;color:var(--text-3)">${escapeHtml((it.location||'')+' '+(it.text||''))}</div>`:''}</div></div>`).join('');
  openEditModal('穿搭详情',`<div style="margin-bottom:8px"><span class="outfit-tag" style="background:${tagColor(o.tag)}">${o.tag}</span>${o.title?` <strong>${escapeHtml(o.title)}</strong>`:''} <span style="font-size:12px;color:var(--text-3)">${fmtDate(o.timestamp)}</span></div><div style="margin:4px 0 10px">${starsHTML(o,true)}</div><div class="outfit-detail-items">${items}</div>${o.note?`<div class="outfit-note" style="background:var(--bg);padding:8px 10px;border-radius:6px">${escapeHtml(o.note)}</div>`:''}`);
  document.getElementById('saveEdit').style.display='none';
  document.getElementById('cancelEdit').textContent='关闭';
}
async function delOutfit(id){
  if(!confirm('确定删除这套穿搭清单吗？'))return;
  S.outfits=S.outfits.filter(o=>o.id!==id);
  await DB.set('outfits',S.outfits);
  showToast('已删除','success');
  renderOutfitList();renderOrgLocations();
}
function editOutfit(id){
  const o=S.outfits.find(x=>x.id===id);if(!o)return;
  let chips=OUTFIT_TAGS.concat(OUTFIT_TAGS.includes(o.tag)?[]:[o.tag]).map(t=>`<span class="tag-chip ${t===o.tag?'active':''}" data-tag="${t}" style="${t===o.tag?`background:${tagColor(t)}`:'background:var(--surface)'}" onclick="selectOutfitTag('${t}')">${t}</span>`).join('');
  openEditModal('编辑穿搭',`<div style="margin-bottom:8px">${starsHTML(o,true)} <span style="font-size:12px;color:var(--text-3)">点击星星评分</span></div><label>标签</label><div class="tag-chips" id="outfit-tag-chips">${chips}</div><label>清单标题</label><input type="text" id="outfit-title" value="${escapeHtml(o.title||'')}" maxlength="30"><label>备注</label><textarea id="outfit-note" rows="3">${escapeHtml(o.note||'')}</textarea>`);
  S._outfitTag=o.tag;
  document.getElementById('saveEdit').onclick=()=>{
    o.tag=S._outfitTag;
    o.title=document.getElementById('outfit-title').value.trim();
    o.note=document.getElementById('outfit-note').value.trim();
    DB.set('outfits',S.outfits).then(()=>{showToast('已更新','success')});
    closeEditModal();document.getElementById('saveEdit').onclick=null;
    renderOutfitList();
  };
}

// ===== Edit Modal =====
function openEditModal(title,bodyHtml){document.getElementById('modalTitle').textContent=title;document.getElementById('modalBody').innerHTML=bodyHtml;document.getElementById('editModal').classList.add('show');document.body.style.overflow='hidden'}
document.getElementById('closeModal').addEventListener('click',closeEditModal);
document.getElementById('cancelEdit').addEventListener('click',closeEditModal);

function downloadOrgTemplate(){
  const ws=XLSX.utils.json_to_sheet([
    {'物品名称':'示例：羽绒服','描述':'黑色，冬季穿','分类':'衣物','存放位置':'大衣柜悬挂','状态':'无需处理'},
    {'物品名称':'示例：充电器','描述':'USB-C 快充，线有点松','分类':'电子产品','存放位置':'抽屉A','状态':'待处理'},
    {'物品名称':'示例：旧手机','描述':'已清理数据','分类':'电子产品','存放位置':'抽屉B','状态':'已处理'}
  ]);
  ws['!cols']=[{wch:20},{wch:25},{wch:15},{wch:18},{wch:10}];
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,'物品清单');
  XLSX.writeFile(wb,'物品导入模板.xlsx');
}
document.getElementById('orgExcelInput').addEventListener('change',async e=>{
  const file=e.target.files[0];if(!file)return;
  try{
    const buf=await file.arrayBuffer();
    const wb=XLSX.read(buf,{type:'array'});
    const ws=wb.Sheets[wb.SheetNames[0]];
    const rows=XLSX.utils.sheet_to_json(ws,{defval:''});
    if(rows.length===0){showToast('Excel文件中没有数据','error');e.target.value='';return}
    // 列名映射（支持中英文）
    const colMap={
      '物品名称':'title','名称':'title','title':'title','Name':'title',
      '描述':'text','内容':'text','说明':'text','text':'text','Description':'text',
      '分类':'category','类别':'category','category':'category','Category':'category',
      '存放位置':'location','位置':'location','location':'location','Location':'location',
      '状态':'status','status':'status','Status':'status'
    };
    let imported=0,newCats=[];
    for(const row of rows){
      const rec={};
      for(const[key,val]of Object.entries(row)){
        const field=colMap[key.trim()];
        if(field)rec[field]=String(val).trim();
      }
      if(!rec.title&&!rec.text){continue}
      // 处理分类：不存在则自动创建
      if(rec.category){
        const exist=S.orgCategories.find(c=>c.name===rec.category);
        if(!exist&&!newCats.find(c=>c.name===rec.category)){
          const nc={id:genId(),name:rec.category,icon:'📦'};
          newCats.push(nc);S.orgCategories.push(nc);
        }
      }
      // 处理状态
      let status='none';
      if(rec.status){
        const s=rec.status.toLowerCase();
        if(s.includes('待')||s.includes('pending'))status='pending';
        else if(s.includes('已')||s.includes('done')||s.includes('完'))status='done';
      }
      const item={
        id:genId(),timestamp:nowISO(),
        category:rec.category||'未分类',
        title:rec.title||'',
        text:rec.text||'',
        location:rec.location||'',
        images:[],status
      };
      S.org.unshift(item);imported++;
    }
    if(newCats.length>0)await DB.set('orgCategories',S.orgCategories);
    if(imported>0){await DB.set('organizing',S.org);renderOrgOverview();showToast(`成功导入 ${imported} 条记录${newCats.length>0?'，新增 '+newCats.length+' 个分类':''}`,'success')}
    else{showToast('没有找到有效数据，请检查列名是否匹配','error')}
  }catch(err){console.error(err);showToast('导入失败：'+err.message,'error')}
  e.target.value='';
});

// ===== Excel Export for Organizing (含图片) =====
function dataUrlExt(src){const m=String(src).match(/^data:image\/(\w+);base64,/);return m?m[1].toLowerCase():null}
async function toPngIfNeeded(src){try{const img=new Image();img.src=src;await img.decode();const c=document.createElement('canvas');c.width=img.naturalWidth||300;c.height=img.naturalWidth?img.naturalHeight:300;c.getContext('2d').drawImage(img,0,0);return c.toDataURL('image/png')}catch(e){return null}}
async function exportOrgExcel(){
  if(typeof ExcelJS==='undefined'){showToast('Excel 组件加载中，请稍后重试','error');return}
  const recs=S.org||[];
  if(recs.length===0){showToast('还没有可导出的物品数据','error');return}
  showToast('正在生成 Excel…','success');
  try{
    const wb=new ExcelJS.Workbook();wb.creator='我的工作台';
    const ws=wb.addWorksheet('物品列表');
    let maxImg=0;recs.forEach(r=>{const n=(r.images||[]).length;if(n>maxImg)maxImg=n});
    const headers=['物品名称','描述','分类','存放位置','状态'];
    for(let i=0;i<maxImg;i++)headers.push('图片'+(i+1));
    ws.columns=headers.map((h,i)=>({header:h,key:'k'+i,width:i<5?22:16}));
    const statusMap={none:'无需处理',pending:'待处理',done:'已处理'};
    let skipped=0;
    for(const r of recs){
      const base=[r.title||'',r.text||'',r.category||'',r.location||'',statusMap[r.status||'none']||'无需处理'];
      const row=ws.addRow(base);row.height=72;
      const imgs=r.images||[];
      for(let i=0;i<imgs.length;i++){
        let src=imgs[i];let ext=dataUrlExt(src);
        if(!(ext==='png'||ext==='jpeg'||ext==='jpg'||ext==='gif')){src=await toPngIfNeeded(src);ext='png'}
        if(!src)continue;
        const m=src.match(/^data:image\/\w+;base64,(.*)$/);if(!m)continue;
        try{const imageId=wb.addImage({base64:m[1],extension:ext==='jpg'?'jpeg':ext});const col=5+i;ws.addImage(imageId,{tl:{col:col,row:row.number-1},br:{col:col+1,row:row.number}})}catch(e){skipped++}
      }
    }
    ws.getRow(1).font={bold:true};
    const buf=await wb.xlsx.writeBuffer();
    const blob=new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');a.href=url;a.download='物品列表_'+fmtYMD(new Date())+'.xlsx';
    document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);
    showToast('已导出 Excel（含图片）'+(skipped?'，'+skipped+' 张未能嵌入':'')+'','success');
  }catch(err){console.error(err);showToast('导出失败：'+(err.message||err),'error')}
}

// ===== 阶段计划 =====
async function loadPhasePlans(){S.phasePlans=(await DB.get('phasePlans'))||[]}
async function savePhasePlans(){await DB.set('phasePlans',S.phasePlans)}
function renderPhaseList(){
  const list=document.getElementById('phaseList');if(!list)return;
  if(!S.phasePlans||S.phasePlans.length===0){list.innerHTML='<div class="empty"><div class="empty-icon">🗓️</div><p>还没有阶段计划<br>点击右上角"新建计划"开始</p></div>';return}
  const sorted=[...S.phasePlans].sort((a,b)=>((a.progress||0)>=100?1:0)-((b.progress||0)>=100?1:0));
  list.innerHTML=sorted.map(p=>{
    const itemCount=(p.items||[]).length;
    return `<div class="phase-plan-card" onclick="openPhasePlan('${p.id}')">
      <span class="pp-del" title="删除" onclick="event.stopPropagation();deletePhasePlan('${p.id}')">×</span>
      <div class="pp-name">${escapeHtml(p.name)}</div>
      <div class="pp-date">📅 ${p.start} 至 ${p.end}</div>
      <div class="prog-row"><div class="progress-wrap"><div class="progress-fill" style="width:${p.progress||0}%"></div></div><span style="font-size:12px;color:var(--text-2);width:40px;text-align:right">${p.progress||0}%</span></div>
      <div class="pp-meta"><span>${itemCount} 条分解</span><span>› 查看</span></div>
    </div>`;
  }).join('');
}
function openPhasePlan(id){
  const p=S.phasePlans.find(x=>x.id===id);if(!p)return;
  S.phaseCurrentId=id;
  document.getElementById('phaseListView').style.display='none';
  document.getElementById('phaseDetailView').style.display='block';
  document.getElementById('phaseDetailTitle').textContent=p.name;
  if(!S.phaseSelDate)S.phaseSelDate=S.date;
  S.phaseCalMonth=S.phaseSelDate.slice(0,7);
  renderPhaseDetail();
}
function backPhaseList(){
  S.phaseCurrentId=null;
  document.getElementById('phaseDetailView').style.display='none';
  document.getElementById('phaseListView').style.display='block';
  renderPhaseList();
}
function renderPhaseDetail(){
  const p=S.phasePlans.find(x=>x.id===S.phaseCurrentId);if(!p)return;
  const items=p.items||[];
  const body=document.getElementById('phaseDetailBody');
  body.innerHTML=`
    <div class="phase-section-title">总进度</div>
    <div class="prog-row" style="margin-bottom:14px"><div class="progress-wrap"><div class="progress-fill" style="width:${p.progress||0}%"></div></div>
      <div class="prog-num"><input type="number" min="0" max="100" value="${p.progress||0}" onchange="setPlanProgress('${p.id}',this.value)"><span>%</span></div></div>

    <div class="phase-section-title">计划分解 <button class="btn btn-ghost btn-sm" onclick="addPhaseItem('${p.id}')">+ 添加</button></div>
    <div class="phase-items">${items.length===0?'<div class="empty" style="padding:20px"><p>还没有分解项</p></div>':items.map(it=>`<div class="phase-item">
        <div class="pi-top"><span class="pi-text">${escapeHtml(it.text)}</span><span class="pi-del" onclick="delPhaseItem('${p.id}','${it.id}')">×</span></div>
        <div class="prog-row"><div class="progress-wrap"><div class="progress-fill" style="width:${it.progress||0}%"></div></div>
        <div class="prog-num"><input type="number" min="0" max="100" value="${it.progress||0}" onchange="setPhaseItemProgress('${p.id}','${it.id}',this.value)"><span>%</span></div></div>
      </div>`).join('')}</div>

    <div class="phase-section-title">今日完成情况</div>
    ${renderPhaseCalendarHTML(p)}
    <div style="font-size:13px;color:var(--text-2);margin-bottom:8px">日期：<strong>${S.phaseSelDate}</strong></div>
    <div class="input-card">
      <textarea id="phaseDailyText" placeholder="填写今天的完成情况..." rows="3"></textarea>
      <div class="input-actions"><button class="btn btn-primary" onclick="addPhaseDaily('${p.id}')">添加记录</button></div>
    </div>
    <div class="phase-daily-list" id="phaseDailyList">${renderPhaseDailyHTML(p)}</div>
  `;
}
function renderPhaseCalendarHTML(p){
  const ym=S.phaseCalMonth;const[y,m]=ym.split('-').map(Number);
  const startWd=new Date(y,m-1,1).getDay();
  const daysInMonth=new Date(y,m,0).getDate();
  const wds=['日','一','二','三','四','五','六'];
  let cells='';
  for(let i=0;i<startWd;i++)cells+='<div class="phase-cal-day muted"></div>';
  for(let d=1;d<=daysInMonth;d++){
    const ds=`${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const has=(p.daily&&p.daily[ds]&&p.daily[ds].length>0)?'has':'';
    const cls=['phase-cal-day',ds===S.date?'today':'',ds===S.phaseSelDate?'selected':'',has].filter(Boolean).join(' ');
    cells+=`<div class="${cls}" onclick="phaseSelectDate('${ds}')">${d}</div>`;
  }
  return `<div class="phase-calendar"><div class="phase-cal-head"><button onclick="phaseCalMove(-1)">‹</button><span class="cal-title">${y}年${m}月</span><button onclick="phaseCalMove(1)">›</button></div><div class="phase-cal-grid">${wds.map(w=>`<div class="cal-wd">${w}</div>`).join('')}${cells}</div></div>`;
}
function renderPhaseDailyHTML(p){
  const list=(p.daily&&p.daily[S.phaseSelDate])||[];
  if(list.length===0)return '<div class="empty" style="padding:20px"><p>这一天还没有记录</p></div>';
  return list.map(r=>`<div class="phase-daily-item"><span>${escapeHtml(r.text)}</span><span class="pi-del" onclick="delPhaseDaily('${p.id}','${S.phaseSelDate}','${r.id}')">×</span></div>`).join('');
}
function phaseSelectDate(ds){S.phaseSelDate=ds;S.phaseCalMonth=ds.slice(0,7);renderPhaseDetail();}
function phaseCalMove(delta){const[y,m]=S.phaseCalMonth.split('-').map(Number);let ny=y,nm=m+delta;if(nm<1){nm=12;ny--}if(nm>12){nm=1;ny++}S.phaseCalMonth=`${ny}-${String(nm).padStart(2,'0')}`;renderPhaseDetail();}
function newPhasePlan(){
  const today=S.date;
  openEditModal('新建阶段计划',`<label>计划名称</label><input type="text" id="phase-name" placeholder="如：Q3 减肥计划" maxlength="30"><label>开始日期</label><input type="date" id="phase-start" value="${today}"><label>结束日期</label><input type="date" id="phase-end" value="${today}">`);
  document.getElementById('saveEdit').onclick=()=>{
    const name=document.getElementById('phase-name').value.trim();
    const start=document.getElementById('phase-start').value;
    const end=document.getElementById('phase-end').value;
    if(!name){showToast('请填写计划名称','error');return}
    if(!start||!end){showToast('请选择起止日期','error');return}
    if(start>end){showToast('开始日期不能晚于结束日期','error');return}
    S.phasePlans.push({id:genId(),name,start,end,progress:0,items:[],daily:{}});
    savePhasePlans().then(()=>{closeEditModal();renderPhaseList();showToast('计划已创建','success')});
  };
}
function renamePhasePlan(){
  const id=S.phaseCurrentId;const p=S.phasePlans.find(x=>x.id===id);if(!p)return;
  openEditModal('编辑计划',`<label>计划名称</label><input type="text" id="phase-name" value="${escapeHtml(p.name).replace(/"/g,'&quot;')}" maxlength="30"><label>开始日期</label><input type="date" id="phase-start" value="${p.start}"><label>结束日期</label><input type="date" id="phase-end" value="${p.end}">`);
  document.getElementById('saveEdit').onclick=()=>{
    const name=document.getElementById('phase-name').value.trim();
    const start=document.getElementById('phase-start').value;
    const end=document.getElementById('phase-end').value;
    if(!name){showToast('请填写计划名称','error');return}
    if(!start||!end){showToast('请选择起止日期','error');return}
    if(start>end){showToast('开始日期不能晚于结束日期','error');return}
    p.name=name;p.start=start;p.end=end;
    savePhasePlans().then(()=>{closeEditModal();renderPhaseList();renderPhaseDetail();showToast('已保存','success')});
  };
}
async function deletePhasePlan(id){
  const pid=id||S.phaseCurrentId;if(!pid)return;
  if(!confirm('确定删除这个计划吗？其分解项与每日记录将一并清除，且不可恢复。'))return;
  S.phasePlans=S.phasePlans.filter(x=>x.id!==pid);
  await savePhasePlans();
  if(id){renderPhaseList();showToast('已删除','success')}
  else{backPhaseList();showToast('已删除','success')}
}
async function setPlanProgress(id,val){const p=S.phasePlans.find(x=>x.id===id);if(!p)return;let v=parseInt(val,10);if(isNaN(v))v=0;v=Math.max(0,Math.min(100,v));p.progress=v;await savePhasePlans();renderPhaseDetail();}
async function setPhaseItemProgress(planId,itemId,val){const p=S.phasePlans.find(x=>x.id===planId);if(!p)return;const it=(p.items||[]).find(i=>i.id===itemId);if(!it)return;let v=parseInt(val,10);if(isNaN(v))v=0;v=Math.max(0,Math.min(100,v));it.progress=v;await savePhasePlans();renderPhaseDetail();}
function addPhaseItem(planId){openEditModal('添加分解项',`<label>分解内容</label><input type="text" id="phase-item-text" placeholder="如：完成需求文档" maxlength="60">`);document.getElementById('saveEdit').onclick=async()=>{const text=document.getElementById('phase-item-text').value.trim();if(!text){showToast('请填写内容','error');return}const p=S.phasePlans.find(x=>x.id===planId);if(!p)return;if(!p.items)p.items=[];p.items.push({id:genId(),text,progress:0});await savePhasePlans();closeEditModal();renderPhaseDetail();showToast('已添加','success')};}
async function delPhaseItem(planId,itemId){if(!confirm('确定删除这条分解项吗？'))return;const p=S.phasePlans.find(x=>x.id===planId);if(!p)return;p.items=p.items.filter(i=>i.id!==itemId);await savePhasePlans();renderPhaseDetail();}
async function addPhaseDaily(planId){const ta=document.getElementById('phaseDailyText');const text=ta.value.trim();if(!text){showToast('请填写内容','error');return}const p=S.phasePlans.find(x=>x.id===planId);if(!p)return;if(!p.daily)p.daily={};if(!p.daily[S.phaseSelDate])p.daily[S.phaseSelDate]=[];p.daily[S.phaseSelDate].unshift({id:genId(),text,timestamp:nowISO()});ta.value='';await savePhasePlans();renderPhaseDetail();showToast('已记录','success');}
async function delPhaseDaily(planId,date,itemId){const p=S.phasePlans.find(x=>x.id===planId);if(!p)return;if(!p.daily[date])return;p.daily[date]=p.daily[date].filter(r=>r.id!==itemId);if(p.daily[date].length===0)delete p.daily[date];await savePhasePlans();renderPhaseDetail();}
